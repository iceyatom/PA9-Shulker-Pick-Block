plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // The Litematica compat layer uses @Pseudo soft-target mixins (string class
    // targets, no imports), so NO compile-time Litematica dependency is required.
    // If you ever decide to compile directly against Litematica, add masa's maven here.
    mavenCentral()
}

loom {
    // Mirrors the Trade Reorder layout: a dedicated `client` source set holds all
    // client-only code. Everything in this mod is client-side (SRS §3.1).
    splitEnvironmentSourceSets()

    mods {
        "shulkerpickblock" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // SRS §3.2 / §7.3: only widen access where a compile-time error is actually hit.
    // None encountered with the current design, so this stays commented out.
    // accessWidenerPath = file("src/main/resources/shulkerpickblock.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // No `mappings` dependency: 26.x Minecraft jars ship with real (Mojmap) names already,
    // and Fabric's intermediary/Yarn pipeline stops at 1.21.11 — see CLAUDE.md
    // "Build Environment Findings". Do not set `yarn_mappings`; none are published for 26.x.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    // MC 26.1.x requires Java 25 for both compilation and the Gradle toolchain (SRS §2).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
