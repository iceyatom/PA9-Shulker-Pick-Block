plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // The Litematica compat layer uses @Pseudo soft-target mixins (string class
    // targets, no imports), so NO compile-time Litematica dependency is required.
    // If you ever decide to compile directly against Litematica, add masa's maven here.
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
    mavenCentral()
}

loom {
    // Mirrors the Trade Reorder layout: a dedicated `client` source set holds all
    // client-only code. Everything in this mod is client-side (SRS §3.1).
    splitEnvironmentSourceSets()

    mods {
        "shulkerpickblock" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // SRS §3.2 / §7.3: only widen access where a compile-time error is actually hit.
    // None encountered with the current design, so this stays commented out.
    // accessWidenerPath = file("src/main/resources/shulkerpickblock.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // No `mappings` dependency: 26.x Minecraft jars ship with real (Mojmap) names already,
    // and Fabric's intermediary/Yarn pipeline stops at 1.21.11 — see CLAUDE.md
    // "Build Environment Findings". Do not set `yarn_mappings`; none are published for 26.x.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu is compile-only (FR-25): it supplies the `ModMenuApi` / `ConfigScreenFactory`
    // interfaces implemented by `compat.modmenu.ModMenuIntegration`, but is NOT required at
    // runtime. Loader only instantiates the `modmenu` entrypoint when Mod Menu is installed,
    // so that class is never loaded otherwise and no NoClassDefFoundError is possible.
    // The config screen itself uses only vanilla widgets, so nothing else here depends on it.
    // `compileOnly`, not `modCompileOnly`: Loom 1.15 dropped the `mod*` configurations because
    // 26.x needs no remapping (Mojmap identity mappings) — same reason fabric-api above is on a
    // plain `implementation`. `transitive = false` keeps Mod Menu's own dependency tree out of
    // our compile classpath; we only need its two API interfaces.
    compileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") { transitive = false }
}

java {
    // MC 26.1.x requires Java 25 for both compilation and the Gradle toolchain (SRS §2).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Matches the naming convention used by the other mods in this modpack, e.g.
// "logstripper - 26.2 - 1.0.0.jar": "<name> - <minecraft_version> - <mod_version>".
def outputBaseName = "${project.archives_base_name} - ${project.minecraft_version} - ${project.mod_version}"

jar {
    archiveFileName = "${outputBaseName}.jar"

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

sourcesJar {
    archiveFileName = "${outputBaseName}-sources.jar"
}
