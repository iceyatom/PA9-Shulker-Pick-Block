plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18-SNAPSHOT'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // The Litematica compat layer uses @Pseudo soft-target mixins (string class
    // targets, no imports), so NO compile-time Litematica dependency is required.
    // If you ever decide to compile directly against Litematica, add masa's maven here.
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
    mavenCentral()
}

loom {
    // Mirrors the Trade Reorder layout: a dedicated `client` source set holds all
    // client-only code. Everything in this mod is client-side (SRS §3.1).
    splitEnvironmentSourceSets()

    mods {
        "shulkerpickblock" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // SRS §3.2 / §7.3: only widen access where a compile-time error is actually hit.
    // None encountered with the current design, so this stays commented out.
    // accessWidenerPath = file("src/main/resources/shulkerpickblock.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Pre-26.x Minecraft jars are obfuscated, so Loom remaps them. Official Mojang mappings keep
    // the source on the same Mojmap names as the 26.x branches; the built jar is remapped to
    // intermediary, as every pre-26.x Fabric mod is.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu is compile-only (FR-25): it supplies the `ModMenuApi` / `ConfigScreenFactory`
    // interfaces implemented by `compat.modmenu.ModMenuIntegration`, but is NOT required at
    // runtime. Loader only instantiates the `modmenu` entrypoint when Mod Menu is installed,
    // so that class is never loaded otherwise and no NoClassDefFoundError is possible.
    // The config screen itself uses only vanilla widgets, so nothing else here depends on it.
    // `modCompileOnly` so Loom remaps Mod Menu to the dev mappings. `transitive = false` keeps
    // Mod Menu's own dependency tree out of our compile classpath; we only need its two API
    // interfaces.
    modCompileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") { transitive = false }
}

java {
    // Gradle runs on the installed JDK 25 toolchain; `release` below makes javac emit bytecode
    // for (and reject APIs newer than) the Java version this Minecraft version requires.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Matches the naming convention used by the other mods in this modpack, e.g.
// "logstripper - 26.3 - 1.0.0.jar": "<name> - <minecraft_version> - <mod_version>".
def outputBaseName = "${project.archives_base_name} - ${project.minecraft_version} - ${project.mod_version}"

// The jar Loom builds before remapping is a dev-only intermediate (Mojmap names); keep it
// marked as such so build/libs holds just the remapped, distributable jar under the modpack name.
jar {
    archiveClassifier = "dev"

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "${outputBaseName}.jar"
}

remapSourcesJar {
    archiveFileName = "${outputBaseName}-sources.jar"
}
