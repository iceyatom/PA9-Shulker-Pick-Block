# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties — Minecraft 1.20.5 (branch 1.20.5, backdate of the 26.3 main branch; pins checked against
# maven.fabricmc.net / meta.fabricmc.net on 2026-10-22). 1.20.5 is obfuscated, so build.gradle uses
# Loom's remapping plugin with official Mojang mappings.
#   check these on https://fabricmc.net/develop / https://meta.fabricmc.net
minecraft_version=1.20.5
loader_version=0.19.5
# Java version the target Minecraft requires (bytecode level + mixin compatibilityLevel).
java_version=21

# Mod Properties
mod_version=1.1.1
maven_group=com.yourname.shulkerpickblock
archives_base_name=shulker-pick-block

# Dependencies
fabric_version=0.97.8+1.20.5
# Mod Menu — compile-only, for the config screen entrypoint (FR-25). 10.0.x is the Mod Menu
# line matching Minecraft 1.20.5.
mod_menu_version=10.0.0
