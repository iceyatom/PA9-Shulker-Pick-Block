# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties — confirmed versions for Minecraft 26.1 (branch 26.1, backdate of the 26.3 main branch, verified 2026-10-22)
#   check these on https://fabricmc.net/develop / https://meta.fabricmc.net
minecraft_version=26.1
# NOTE: Yarn mappings are NOT published for 26.x at the time of writing (see CLAUDE.md
# "Build Environment Findings"). Left here for when/if a Yarn build is released.
loader_version=0.19.5

# Mod Properties
mod_version=1.1.1
maven_group=com.yourname.shulkerpickblock
archives_base_name=shulker-pick-block

# Dependencies
fabric_version=0.145.1+26.1
# Mod Menu — compile-only, for the config screen entrypoint (FR-25). Must be a 26.1-compatible
# build; 18.0.x is the Mod Menu line for 26.1.
mod_menu_version=18.0.2
